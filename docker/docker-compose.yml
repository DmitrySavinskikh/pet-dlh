version: '3.8'

services:
  # MinIO - S3-compatible object storage for Iceberg data
  minio:
    image: minio/minio:RELEASE.2024-01-01T16-36-33Z
    container_name: gameguard-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gameguard-network

  # Create MinIO buckets on startup
  minio-init:
    image: minio/mc:RELEASE.2024-01-01T16-36-33Z
    container_name: gameguard-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 ${MINIO_ACCESS_KEY:-minioadmin} ${MINIO_SECRET_KEY:-minioadmin};
      mc mb -p myminio/iceberg-data;
      mc mb -p myminio/warehouse;
      exit 0;
      "
    networks:
      - gameguard-network

  # Kafka with KRaft mode (no Zookeeper needed)
  kafka:
    image: apache/kafka:3.7.0
    container_name: gameguard-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://localhost:9092,PLAINTEXT://kafka:19092
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:2181
      KAFKA_LISTENERS: PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:2181,PLAINTEXT://0.0.0.0:19092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-gameguard-cluster-id}
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - gameguard-network

  # Kafka topic initialization
  kafka-init:
    image: apache/kafka:3.7.0
    container_name: gameguard-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      echo 'Waiting for Kafka to be ready...';
      sleep 10;
      kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic raw.telemetry --partitions 3 --replication-factor 1;
      kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic anomaly.alerts --partitions 1 --replication-factor 1;
      echo 'Topics created successfully';
      exit 0;
      "
    networks:
      - gameguard-network

  # Iceberg REST Catalog
  iceberg-rest-catalog:
    image: tabulario/iceberg-rest:1.4.3
    container_name: gameguard-iceberg-rest
    ports:
      - "8181:8181"
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      CATALOG_CATALOG__IMPL: org.apache.iceberg.rest.RESTCatalog
      CATALOG_URI: http://0.0.0.0:8181
      CATALOG_WAREHOUSE: s3://warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH_STYLE_ACCESS: "true"
      CATALOG_S3_REGION: us-east-1
    depends_on:
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8181/management/v1/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gameguard-network

  # Spark for streaming and batch processing
  spark-master:
    image: bitnami/spark:3.5.1
    container_name: gameguard-spark-master
    ports:
      - "8080:8080"
      - "7077:7077"
    environment:
      SPARK_MODE: master
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_MASTER_WEBUI_PORT: 8080
      SPARK_CONF_SPARK_DRIVER_MEMORY: 2g
      SPARK_CONF_SPARK_EXECUTOR_MEMORY: 2g
      SPARK_CONF_SPARK_EXECUTOR_CORES: 2
      SPARK_CONF_SPARK_SQL_EXTENSIONS: org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
      SPARK_CONF_SPARK_SQL_CATALOG_gameguard: org.apache.iceberg.spark.SparkCatalog
      SPARK_CONF_SPARK_SQL_CATALOG_gameguard_type: rest
      SPARK_CONF_SPARK_SQL_CATALOG_gameguard_uri: http://iceberg-rest-catalog:8181
      SPARK_CONF_SPARK_SQL_CATALOG_gameguard_warehouse: s3://warehouse/
      SPARK_CONF_SPARK_HADOOP_fs_s3a_impl: org.apache.hadoop.fs.s3a.S3AFileSystem
      SPARK_CONF_SPARK_HADOOP_fs_s3a_endpoint: http://minio:9000
      SPARK_CONF_SPARK_HADOOP_fs_s3a_access_key: ${MINIO_ACCESS_KEY:-minioadmin}
      SPARK_CONF_SPARK_HADOOP_fs_s3a_secret_key: ${MINIO_SECRET_KEY:-minioadmin}
      SPARK_CONF_SPARK_HADOOP_fs_s3a_path_style_access: "true"
      SPARK_CONF_SPARK_HADOOP_fs_s3a_region: us-east-1
    volumes:
      - ./spark_jobs:/opt/spark/jobs
    depends_on:
      iceberg-rest-catalog:
        condition: service_healthy
    networks:
      - gameguard-network

  # Trino for SQL access
  trino:
    image: trinodb/trino:440
    container_name: gameguard-trino
    ports:
      - "8088:8080"
    volumes:
      - ./docker/trino/catalog:/etc/trino/catalog
    environment:
      TRINO_JVM_MAX_HEAP: 2G
    depends_on:
      minio:
        condition: service_healthy
      iceberg-rest-catalog:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "trino", "--server", "http://localhost:8080", "--execute", "SELECT 1"]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - gameguard-network

volumes:
  minio_data:
  kafka_data:

networks:
  gameguard-network:
    driver: bridge
