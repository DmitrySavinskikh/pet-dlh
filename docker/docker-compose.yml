services:
  # MinIO - S3-compatible object storage for Iceberg data
  minio:
    image: minio/minio:latest
    container_name: gameguard-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gameguard-network

  # Create MinIO buckets on startup
  minio-init:
    image: minio/mc:latest
    container_name: gameguard-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 ${MINIO_ACCESS_KEY:-minioadmin} ${MINIO_SECRET_KEY:-minioadmin};
      mc mb -p myminio/iceberg-data;
      mc mb -p myminio/warehouse;
      exit 0;
      "
    networks:
      - gameguard-network

  # Kafka with KRaft mode (no Zookeeper needed)
  kafka:
    image: apache/kafka:3.7.0
    container_name: gameguard-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://localhost:9092,PLAINTEXT://kafka:19092
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:2181
      KAFKA_LISTENERS: PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:2181,PLAINTEXT://0.0.0.0:19092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-gameguard-cluster-id}
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server kafka:19092 --list || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 60s
    networks:
      - gameguard-network

  # Kafka topic initialization
  kafka-init:
    image: apache/kafka:3.7.0
    container_name: gameguard-kafka-init
    depends_on:
      - kafka
    entrypoint: >
      /bin/sh -c "
      echo 'Waiting for Kafka to be ready...';
      for i in {1..60}; do
        if kafka-topics.sh --bootstrap-server kafka:19092 --list > /dev/null 2>&1; then
          echo 'Kafka is ready';
          break;
        fi;
        echo 'Waiting for Kafka... attempt '$i'/60';
        sleep 2;
      done;
      kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic raw.telemetry --partitions 3 --replication-factor 1;
      kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic anomaly.alerts --partitions 1 --replication-factor 1;
      echo 'Topics created successfully';
      exit 0;
      "
    networks:
      - gameguard-network

  # Iceberg REST Catalog
  iceberg-rest-catalog:
    image: tabulario/iceberg-rest:1.6.0
    container_name: gameguard-iceberg-rest
    ports:
      - "8181:8181"
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      CATALOG_WAREHOUSE: s3://warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH_STYLE_ACCESS: "true"
      CATALOG_S3_REGION: us-east-1
      CATALOG_JDBC_DRIVER_CLASS: org.h2.Driver
      CATALOG_JDBC_URL: "jdbc:h2:mem:iceberg;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE"
      CATALOG_JDBC_USER: sa
      CATALOG_JDBC_PASSWORD: ""
      REST_PORT: "8181"
    depends_on:
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8181/v1/config"]
      interval: 30s
      timeout: 10s
      retries: 15
      start_period: 60s
    networks:
      - gameguard-network

  # Spark for streaming and batch processing
  spark-master:
    image: apache/spark:3.5.1
    container_name: gameguard-spark-master
    ports:
      - "8080:8080"
      - "7077:7077"
    environment:
      SPARK_MODE: master
    volumes:
      - ./spark_jobs:/opt/spark/jobs
    working_dir: /opt/spark
    command: tail -f /dev/null
    depends_on:
      - iceberg-rest-catalog
    networks:
      - gameguard-network

  # Trino for SQL access
  trino:
    image: trinodb/trino:440
    container_name: gameguard-trino
    ports:
      - "8088:8080"
    volumes:
      - ./docker/trino/catalog:/etc/trino/catalog
    environment:
      TRINO_JVM_MAX_HEAP: 2G
    depends_on:
      - minio
      - iceberg-rest-catalog
    networks:
      - gameguard-network

volumes:
  minio_data:
  kafka_data:

networks:
  gameguard-network:
    driver: bridge
